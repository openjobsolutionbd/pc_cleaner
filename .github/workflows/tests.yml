# Automatic testing — runs on every push and every pull request.
#
# This is the third piece of the app's safety net (alongside the
# in-app error log and the try/except wrapping around every worker):
# it catches a REGRESSION — a change that breaks something that used
# to work — the moment it's pushed, before it ever reaches the actual
# PC. Click the "Actions" tab on GitHub after any push to see the
# result: a green check means every test still passes; a red X means
# something broke, with the exact failing test named in the log.
#
# Scope: this runs every test module except test_integration_gui.py.
# The GUI integration tests open a real Tkinter window, which needs a
# display server this runner doesn't reliably have — rather than wire
# up a virtual display and risk the CI going red for a display problem
# instead of a real bug (which would make the whole signal untrustworthy),
# those tests stay as a local step: `run_tests.bat` on the actual
# Windows machine, which already runs the complete set via
# `python -m unittest discover`.

name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # lets you also trigger a run manually from the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run the automated test suite
        run: >
          python -m unittest
          test_cleaner_core
          test_browser_core
          test_history_log
          test_error_log
          test_scheduler
          test_startup_manager
          test_system_tools
          test_no_network_guarantee
          -v
