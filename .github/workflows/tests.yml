# Automatic testing — runs on every push and every pull request.
name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run the automated test suite
        run: >
          python -m unittest
          test_cleaner_core
          test_browser_core
          test_history_log
          test_error_log
          test_scheduler
          test_startup_manager
          test_system_tools
          test_no_network_guarantee
          -v
